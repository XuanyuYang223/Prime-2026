[project]
name = "kinetic-flow"
version = "0.1.0"
description = "A small conditional flow-matching model for kinetic typography videos"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
